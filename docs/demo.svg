<g class="e0"><rect x="470" y="84" width="394" height="46" rx="14" fill="#c96442"/><text x="490" y="113" class="t" fill="#fff">What's due this week, and what should I start first?</text></g><g class="e1"><rect x="36" y="150" width="273" height="30" rx="15" fill="#1f2937" stroke="#374151"/><circle cx="52" cy="165" r="5" fill="#34d399"/><text x="66" y="169.5" class="m" fill="#e5e7eb">get_all_upcoming_work<tspan fill="#9ca3af"> · 3 due</tspan></text></g><g class="e2"><rect x="319" y="150" width="297" height="30" rx="15" fill="#1f2937" stroke="#374151"/><circle cx="335" cy="165" r="5" fill="#34d399"/><text x="349" y="169.5" class="m" fill="#e5e7eb">get_overdue_assignments<tspan fill="#9ca3af"> · 1 late</tspan></text></g><g class="e3"><rect x="626" y="150" width="186" height="30" rx="15" fill="#1f2937" stroke="#374151"/><circle cx="642" cy="165" r="5" fill="#34d399"/><text x="656" y="169.5" class="m" fill="#e5e7eb">read_file<tspan fill="#9ca3af"> · policy</tspan></text></g><text class="e4 t" x="36" y="222" fill="#f3f4f6" font-weight="600">Three things, most urgent first:</text><text class="e5 t" x="36" y="254" fill="#d1d5db">1.  Reading Response 6 (ECON101) · 10 pts · due tomorrow</text><text class="e6 t" x="36" y="286" fill="#d1d5db">2.  Problem Set 4 (CS301) · 30 pts · due in 3 days</text><text class="e7 t" x="36" y="312" fill="#d1d5db">     Biggest payoff: the rubric is 20 of 30 points on correctness.</text><text class="e8 t" x="36" y="344" fill="#d1d5db">3.  Essay 2 (ENGL210) · 50 pts · due in 6 days</text><text class="e9 t" x="36" y="376" fill="#f3f4f6" font-weight="600">Heads up: Problem Set 3 is 3 days overdue. The late policy is 10% per day,</text><text class="e10 t" x="36" y="408" fill="#f3f4f6" font-weight="600">so submitting tonight still beats waiting.</text>
<text x="450.0" y="544" text-anchor="middle" class="s" fill="#6b7280">Illustrative · built from the repo's demo data (npm run demo)</text>
